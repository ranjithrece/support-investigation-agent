[project]
name = "support-agent"
version = "0.1.0"
description = "Autonomous Support Investigation Agent (LangGraph + Ollama, fully local)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langgraph>=1.2.22",
  "langgraph-checkpoint-sqlite>=3.1.3",
  "langchain-core>=1.0",
  "langchain-ollama>=1.1.0",
  "chromadb>=1.5.9",
  "langsmith>=0.15.0",
  "pydantic>=2.14",
  "pydantic-settings>=2.5",
  "typer>=0.29",
  "rich>=13",
  "pyyaml>=6",
  "pandas>=2",
  "pyarrow>=15",
  "huggingface-hub>=0.25",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
agent = "support_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: needs a running Ollama (slow)"]
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP047", "E501", "B008", "B905"]
